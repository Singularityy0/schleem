services:
  - type: worker
    name: schmeckles-keeper
    runtime: rust
    plan: starter
    rootDir: keeper
    buildCommand: cargo build --release
    startCommand: ./target/release/schmeckles-keeper
    numInstances: 1
    maxShutdownDelaySeconds: 10
    envVars:
      - key: MONAD_RPC_URL
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: MARKET_ADDRESS
        value: "0x97aCD4eeBA9a42a1060BBA53dDABBe0673606985"
      - key: SUPRA_ORACLE_ADDRESS
        value: "0xf91F9Df392e380EAfB84F1212B222F1c33dE3673"
      - key: SUPRA_PROOF_URL
        value: "https://rpc-testnet-dora-2.supra.com"
      - key: KEEPER_POLL_MILLISECONDS
        value: "1000"
      - key: LIVE_UPDATE_INTERVAL_SECONDS
        value: "20"
      - key: TRANSACTION_TIMEOUT_SECONDS
        value: "45"
      - key: RUST_LOG
        value: "schmeckles_keeper=info"
